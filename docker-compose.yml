version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventoria-postgres
    environment:
      POSTGRES_USER: eventoria_user
      POSTGRES_PASSWORD: eventoria_pass
      POSTGRES_DB: eventoria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventoria_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventoria-backend
    environment:
      DATABASE_URL: postgresql://eventoria_user:eventoria_pass@postgres:5432/eventoria_db
      JWT_SECRET: your-super-secret-jwt-key
      JWT_EXPIRES_IN: 24h
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventoria-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
